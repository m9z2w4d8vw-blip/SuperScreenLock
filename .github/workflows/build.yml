name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The build itself is in ci/build.sh, so this file shouldn't need editing again.
jobs:
  build:
    name: Build and publish IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Build, sign and package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ ! -f ci/build.sh ]; then
            echo "::error::ci/build.sh is missing. Copy everything from the zip into the repo, then push again."
            exit 1
          fi
          bash ci/build.sh build

      - name: List compiler errors
        if: failure()
        run: bash ci/build.sh errors || true

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: bash ci/build.sh publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperScreenLock-build-${{ github.run_number }}
          path: SuperScreenLock.ipa
          if-no-files-found: error
