# The screen-time report extension, kept in its own project so a problem here
# can never stop the app itself from building. ci/build.sh builds it second
# and copies it into SuperScreenLock.app/Extensions/.
name: ActivityReport

options:
  bundleIdPrefix: com.parv
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  ActivityReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Sources/ActivityReport
    settings:
      base:
        PRODUCT_NAME: ActivityReport
        PRODUCT_BUNDLE_IDENTIFIER: com.parv.superscreenlock.ActivityReport
        INFOPLIST_FILE: Config/ActivityReport-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  ActivityReport:
    build:
      targets:
        ActivityReport: all
    archive:
      config: Release
